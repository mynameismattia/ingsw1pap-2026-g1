# ════════════════════════════════════════════════════════════
# Tutorial / Rules page  (tutorial.fxml)
# ════════════════════════════════════════════════════════════
tutorial.title=How to play
tutorial.action.start=Back to menu and play
tutorial.hero.title=Blackjack in a nutshell
tutorial.hero.subtitle=The essential rules, with a few examples.
tutorial.tooltip.back=Back to the menu
tutorial.tooltip.start=Back to the menu and configure a game
tutorial.payouts.blackjack=Natural blackjack
tutorial.payouts.win=Standard win
tutorial.payouts.insurance=Successful insurance
tutorial.payouts.push=Push (tie)
tutorial.payouts.loss=Bust or loss

tutorial.objective.title=Goal
tutorial.objective.body=Beat the dealer. Get your hand closer to 21 than the dealer's without going over. If you bust (go past 21) you lose automatically, no matter the dealer's score.

tutorial.values.title=Card values
tutorial.values.body=• Number cards (2-10): face value.\n• Face cards (J, Q, K): worth 10.\n• Ace (A): worth 1 or 11, whichever helps you. A hand with an Ace counted as 11 (without busting) is called "soft".

tutorial.flow.title=Round flow
tutorial.flow.body=1. You place your bet.\n2. The dealer deals two cards to each player and two to themselves (one face-down).\n3. If the dealer shows an Ace, insurance is offered (see below).\n4. Your turn: pick an action until you stand or bust.\n5. Once every player is done, the dealer reveals the hole card and plays.\n6. Scores are compared and payouts are made.

tutorial.actions.title=Actions on your turn
tutorial.actions.hit.title=Hit
tutorial.actions.hit.body=Draw another card. You can keep hitting until you stand or bust. Hitting to exactly 21 ends your turn automatically.
tutorial.actions.stand.title=Stand
tutorial.actions.stand.body=End your turn with the current score and pass to the next player or the dealer.
tutorial.actions.double.title=Double Down
tutorial.actions.double.body=Double your bet and receive exactly one more card. Only available with your first two cards and if you have enough balance.
tutorial.actions.split.title=Split
tutorial.actions.split.body=If your first two cards have the same value, you can split them into two separate hands. Each hand gets one new card and plays independently. A pair of Aces gets only one card per hand and cannot draw further.
tutorial.actions.insurance.title=Insurance
tutorial.actions.insurance.body=Only offered when the dealer shows an Ace. You pay half your bet: if the dealer has blackjack, insurance pays 2:1; otherwise you lose it. Statistically, never a good idea.

tutorial.dealer.title=Dealer rules
tutorial.dealer.body=The dealer does not choose: they follow a fixed rule. They hit while their score is under 17 or they have a "soft 17" (Ace + 6). They stand on any 17 or higher (except soft 17). If the dealer busts, every player still in the round wins.

tutorial.payouts.title=Payouts
tutorial.payouts.body=• Normal win: 1:1 (you double your bet).\n• Natural blackjack (Ace + face/10 on the first two cards): 3:2.\n• Push (tie): your bet is returned.\n• Bust or loss: you lose the bet.\n• Successful insurance: 2:1 on the insurance stake.


