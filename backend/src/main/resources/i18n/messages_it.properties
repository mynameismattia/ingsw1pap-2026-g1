# ════════════════════════════════════════════════════════════
# Tutorial / Rules page  (tutorial.fxml)
# ════════════════════════════════════════════════════════════
tutorial.title=Come si gioca
tutorial.action.start=Torna al menu e gioca
tutorial.hero.title=Blackjack in breve
tutorial.hero.subtitle=Le regole essenziali, con qualche esempio.
tutorial.tooltip.back=Torna al menu
tutorial.tooltip.start=Torna al menu e configura una partita
tutorial.payouts.blackjack=Blackjack naturale
tutorial.payouts.win=Vittoria normale
tutorial.payouts.insurance=Assicurazione vincente
tutorial.payouts.push=Pareggio
tutorial.payouts.loss=Sballo o sconfitta

tutorial.objective.title=Obiettivo
tutorial.objective.body=Batti il banco. Avvicinati a 21 con le tue carte senza superarlo. Se sballi (vai oltre 21) perdi automaticamente, indipendentemente dal punteggio del banco.

tutorial.values.title=Valore delle carte
tutorial.values.body=• Carte numerate (2-10): valgono il loro numero.\n• Figure (J, Q, K): valgono 10.\n• Asso (A): vale 1 o 11, a seconda di quale ti conviene. Una mano con un Asso che vale 11 senza sballare si chiama "soft".

tutorial.flow.title=Svolgimento del round
tutorial.flow.body=1. Piazzi la puntata.\n2. Il banco distribuisce due carte a ogni giocatore e due a se stesso (una coperta).\n3. Se il banco mostra un Asso, ti viene offerta l'assicurazione (vedi sotto).\n4. Tocca a te: scegli un'azione finché non stai o sballi.\n5. Quando tutti hanno finito, il banco gira la carta coperta e gioca.\n6. Si confrontano i punteggi e si pagano le vincite.

tutorial.actions.title=Azioni del tuo turno
tutorial.actions.hit.title=Hit (Carta)
tutorial.actions.hit.body=Chiedi un'altra carta. Puoi continuare a chiedere finché non stai o sballi. Se arrivi esattamente a 21, il turno termina automaticamente.
tutorial.actions.stand.title=Stand (Sto)
tutorial.actions.stand.body=Termini il tuo turno con il punteggio attuale e passi al giocatore successivo o al banco.
tutorial.actions.double.title=Double Down (Raddoppio)
tutorial.actions.double.body=Raddoppi la puntata e ricevi esattamente una carta in più. Disponibile solo con le prime due carte e se hai abbastanza saldo.
tutorial.actions.split.title=Split (Dividi)
tutorial.actions.split.body=Se le tue prime due carte hanno lo stesso valore, puoi dividerle in due mani separate. Ogni mano riceve una carta nuova e gioca indipendentemente. Una coppia di Assi riceve una sola carta per mano e non può chiedere altro.
tutorial.actions.insurance.title=Insurance (Assicurazione)
tutorial.actions.insurance.body=Offerta solo se il banco mostra un Asso. Paghi metà della tua puntata: se il banco ha blackjack, l'assicurazione viene pagata 2:1; altrimenti la perdi. Statisticamente non è mai una buona idea.

tutorial.dealer.title=Regole del banco
tutorial.dealer.body=Il banco non sceglie: segue una regola fissa. Chiede carta finché il punteggio è sotto 17, oppure ha un "soft 17" (Asso + 6). Sta su qualsiasi punteggio da 17 in poi (escluso il soft 17). Se il banco sballa, vincono tutti i giocatori ancora in gioco.

tutorial.payouts.title=Pagamenti
tutorial.payouts.body=• Vittoria normale: 1:1 (raddoppi la puntata).\n• Blackjack naturale (Asso + figura/10 dalle prime due carte): 3:2.\n• Pareggio (push): la puntata ti viene restituita.\n• Sballo o sconfitta: perdi la puntata.\n• Assicurazione vincente: 2:1 sulla quota assicurativa.


